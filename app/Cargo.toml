[package]
name = "gamehub"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
async-trait = "0.1"
axum = "0.8"
redis = { version = "1", features = ["tokio-comp", "sentinel"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
